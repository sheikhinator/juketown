name: Build JukeTown APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # If the repo contains only the uploaded zip, unpack it first.
      - name: Unpack project zip (if present)
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            echo "Found ${zips[0]} — unpacking"
            unzip -o "${zips[0]}" -d _unpacked
            # move the folder that contains settings.gradle.kts to the repo root
            root=$(dirname "$(find _unpacked -name settings.gradle.kts | head -n1)")
            if [ -n "$root" ] && [ "$root" != "." ]; then
              rsync -a "$root"/ ./
            fi
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/JukeTown-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JukeTown-APK
          path: out/JukeTown-debug.apk
          if-no-files-found: error

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: JukeTown (latest build)
          files: out/JukeTown-debug.apk
          make_latest: true
